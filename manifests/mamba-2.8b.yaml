# state-spaces/mamba-2.8b-hf: ~2.8B params in float32 (~11GB total).
# On 4GB Pi nodes this does not fit on a single node - it needs at
# least 2, and comfortably 3, to split the 64 layers across enough RAM.
# layers/hidden_dim/state_dim below are taken directly from the real
# checkpoint's config.json (n_layer, hidden_size, state_size).
name: mamba-2.8b
arch: mamba
checkpoint: state-spaces/mamba-2.8b-hf
layers: 64
hidden_dim: 2560
state_dim: 16
input_type: text
tokenizer: EleutherAI/gpt-neox-20b
dtype: float32
